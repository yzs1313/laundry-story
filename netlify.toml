# فحص الأسرار في Netlify يبقى شغّالاً، ونستثني فقط قيماً عامة لا تُعد سرية (رابط الموقع).
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "ALLOWED_ORIGIN,BANK_HOLDER,BANK_NAME,BANK_IBAN"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/carwash"
  to = "/carwash.html"
  status = 200
